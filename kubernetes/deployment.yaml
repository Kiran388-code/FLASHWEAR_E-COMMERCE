apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashwear-backend
  namespace: default
  labels:
    app: flashwear-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flashwear-backend
  template:
    metadata:
      labels:
        app: flashwear-backend
    spec:
      containers:
      - name: web
        image: flashwear-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flashwear-secrets
              key: database-url
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: CELERY_BROKER_URL
          value: "amqp://guest:guest@rabbitmq-service:5672//"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-service:9200"
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: flashwear-secrets
              key: jwt-secret-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: "1.0"
            memory: 1024Mi
          requests:
            cpu: "0.5"
            memory: 512Mi
