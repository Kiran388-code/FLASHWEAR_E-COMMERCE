name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashwear_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run code formatting check (black)
      run: |
        pip install black
        black --check app/

    - name: Run test suite
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flashwear_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        RABBITMQ_HOST: localhost
        RABBITMQ_PORT: 5672
        CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        ELASTICSEARCH_HOSTS: http://localhost:9200
        FIREBASE_PROJECT_ID: flashwear-firebase-dev
        JWT_SECRET_KEY: supersecretkeythatisatleast32characterslongforjwtsecurity
        JWT_ALGORITHM: HS256
      run: |
        pytest -v
